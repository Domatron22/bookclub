[pytest]
# Put the project root on sys.path so `app` is importable.
#
# `python -m pytest` adds the working directory implicitly and `pytest` does
# not, so without this the suite passes locally and fails in CI with
# `ModuleNotFoundError: No module named 'app'`. Setting it here makes the two
# invocations equivalent rather than relying on whichever one you happen to use.
pythonpath = .

testpaths = tests
addopts = -q --strict-markers --tb=short
filterwarnings =
    # The codebase uses datetime.utcnow() consistently; migrating it is its own
    # change, and the deprecation noise would otherwise drown real warnings.
    ignore:datetime.datetime.utcnow:DeprecationWarning
