{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8 transition-colors duration-200">
        <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Log In</h2>
        <p class="text-gray-600 dark:text-gray-400 mb-6">Enter your username and account secret to continue.</p>

        {% if error %}
        <div class="mb-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4 flex items-start">
            <i class="fas fa-exclamation-circle text-red-600 dark:text-red-400 mt-0.5 mr-3 flex-shrink-0"></i>
            <span class="text-sm text-red-800 dark:text-red-300">{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/auth/login" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Username <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    value="{{ username or '' }}"
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-colors duration-200"
                    placeholder="Your username"
                    autocomplete="username"
                >
            </div>

            <div>
                <label for="account_secret" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Account Secret <span class="text-red-500">*</span>
                </label>
                <input
                    type="password"
                    id="account_secret"
                    name="account_secret"
                    required
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-colors duration-200"
                    placeholder="Paste your account secret"
                    autocomplete="current-password"
                >
                <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">The secret shown when you first registered</p>
            </div>

            <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white font-semibold px-6 py-3 rounded-lg transition duration-150"
            >
                <i class="fas fa-sign-in-alt mr-2"></i>Log In
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
            Don't have an account?
            <a href="/auth/register" class="text-indigo-600 dark:text-indigo-400 font-medium hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
