services:
  coverbound:
    image: ghcr.io/domatron22/bookclub:latest
    container_name: coverbound-app
    user: "${APP_UID:-4001}:${APP_GID:-4001}"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file: "coverbound.env"
    restart: unless-stopped
    # Harden the runtime container
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
