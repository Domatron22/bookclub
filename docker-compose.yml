services:
  coverbound:
    build: .
    container_name: coverbound-app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file: "coverbound.env"
    restart: unless-stopped
    # Harden the runtime container
    security_opt:
      - no-new-privileges:true  
    cap_drop:
      - ALL                      
    read_only: true             
    tmpfs:
      - /tmp:size=64m,mode=1777 
